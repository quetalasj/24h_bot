[workspace]
name = "telegram-timer-bot"
version = "0.1.0"
description = "Асинхронный Telegram-бот для управления таймерами"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"

[pypi-dependencies]
aiogram = ">=3.7,<4"

[tasks]
start = "python bot.py"